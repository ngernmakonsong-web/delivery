<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b4f45">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="จัดส่งสินค้า">
<meta name="description" content="ระบบจัดส่งสินค้า ติดตามรถและงานส่งของ วางบิล รับเช็ค">
<title>ระบบจัดส่งสินค้า</title>

<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="icon" href="icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- ============ TOP BAR ============ -->
<header id="topbar">
  <div class="tb-row">
    <button id="btnMode" class="tb-mode" type="button" aria-label="สลับมุมมอง">
      <span id="modeLabel">คนขับ</span>
      <svg viewBox="0 0 20 20" width="14" height="14" aria-hidden="true"><path d="M5 8l5 5 5-5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>

    <div class="tb-date">
      <button id="btnDatePrev" class="tb-icon" type="button" aria-label="วันก่อนหน้า">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M12 4l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <button id="btnDate" class="tb-datebtn" type="button">
        <span id="dateLabel">วันนี้</span>
      </button>
      <button id="btnDateNext" class="tb-icon" type="button" aria-label="วันถัดไป">
        <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><path d="M8 4l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>

    <button id="btnGps" class="tb-icon tb-gps" type="button" aria-label="สถานะ GPS" title="สถานะ GPS">
      <svg viewBox="0 0 20 20" width="18" height="18" aria-hidden="true"><circle cx="10" cy="10" r="3.2" fill="currentColor"/><circle cx="10" cy="10" r="7" fill="none" stroke="currentColor" stroke-width="1.8" opacity=".45"/></svg>
    </button>

    <button id="btnUser" class="tb-user hidden" type="button" aria-label="บัญชีและออกจากระบบ" title="บัญชีและออกจากระบบ">
      <span id="userInitials">?</span>
    </button>
  </div>

  <div id="driverStrip" class="tb-driver"></div>
</header>

<!-- ============ SCREEN ============ -->
<main id="screen" aria-live="polite"></main>

<!-- ============ BOTTOM NAV ============ -->
<nav id="nav" role="tablist"></nav>

<!-- ============ SHEET / MODAL ============ -->
<div id="sheetWrap" class="hidden" role="dialog" aria-modal="true">
  <div id="sheetBackdrop"></div>
  <div id="sheet">
    <div id="sheetHandle"><span></span></div>
    <div id="sheetBody"></div>
  </div>
</div>

<!-- ============ TOAST ============ -->
<div id="toast" class="hidden"></div>

<!-- hidden file inputs: ถ่ายจากกล้อง / เลือกจากคลังภาพ / กู้คืนข้อมูล -->
<input type="file" id="photoInput" accept="image/*" capture="environment" hidden>
<input type="file" id="photoPick" accept="image/*" hidden>
<input type="file" id="restoreInput" accept=".json,application/json" hidden>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.58.0/dist/umd/supabase.min.js"></script>
<script src="js/config.js"></script>
<script src="js/db.js"></script>
<script src="js/cloud.js"></script>
<script src="js/core.js"></script>
<script src="js/auth.js"></script>
<script src="js/views.js"></script>
<script src="js/forms.js"></script>
<script src="js/route.js"></script>
<script src="js/map.js"></script>
</body>
</html>
